[project]
name = "shospital-api"
version = "2.0.0"
description = "S_Hospital v2 - API local (FastAPI) de caja hospitalaria offline"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "SQLAlchemy>=2.0",
    "alembic",
    "PyMySQL",
    "pydantic>=2",
    "pydantic-settings",
    "argon2-cffi",
    "python-multipart",
    "reportlab",
    "openpyxl",
    "cryptography",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "B008",   # FastAPI Depends()/Query() in argument defaults is idiomatic
    "RUF001", # Spanish text uses typographic characters on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
