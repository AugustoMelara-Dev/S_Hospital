services:
  backend:
    image: s_hospital-backend:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /shared_public &&
        cp -r /var/www/html/public/. /shared_public/ &&
        cp -r /var/www/frontend/dist/. /shared_public/ &&
        test -f /shared_public/index.html || { echo 'FATAL: frontend dist is empty'; exit 1; } &&
        php artisan config:cache &&
        exec php-fpm
      "
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_SCHEME: ${APP_SCHEME:-http}
      APP_URL: ${APP_SCHEME:-http}://${SERVER_IP:?SERVER_IP is required}:${APP_PORT:-8000}
      HOSPITAL_ALLOW_INSECURE_HTTP: ${HOSPITAL_ALLOW_INSECURE_HTTP:?Set 0 for HTTPS or 1 to explicitly accept insecure LAN HTTP}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hospital_billing}
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_STORE: database
      DB_CACHE_TABLE: cache
      DB_CACHE_LOCK_TABLE: cache_locks
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      LOG_CHANNEL: daily
      LOG_LEVEL: warning
      HOSPITAL_DUMP_BINARY: /usr/bin/mariadb-dump
      HOSPITAL_BACKUP_ENCRYPTION_KEY: ${HOSPITAL_BACKUP_ENCRYPTION_KEY:?HOSPITAL_BACKUP_ENCRYPTION_KEY is required}
      HOSPITAL_MIGRATION_BACKUP_CONFIRMED: ${HOSPITAL_MIGRATION_BACKUP_CONFIRMED:-false}
      RUN_MIGRATIONS: "true"
      SERVER_IP: ${SERVER_IP:?SERVER_IP is required}
      SANCTUM_STATEFUL_DOMAINS: ${SERVER_IP},${SERVER_IP}:${APP_PORT:-8000}
      CORS_ALLOWED_ORIGINS: ${APP_SCHEME:-http}://${SERVER_IP}:${APP_PORT:-8000}
      BROADCAST_CONNECTION: pusher
      PUSHER_APP_ID: ${PUSHER_APP_ID:?PUSHER_APP_ID is required}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:?PUSHER_APP_KEY is required}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:?PUSHER_APP_SECRET is required}
      PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
      PUSHER_HOST: soketi
      PUSHER_PORT: 6001
      PUSHER_SCHEME: http
      PUSHER_CLIENT_HOST: ${SERVER_IP:?SERVER_IP is required}
      PUSHER_CLIENT_PORT: ${APP_PORT:-8000}
      PUSHER_CLIENT_SCHEME: ${APP_SCHEME:-http}
    volumes:
      - backup_data:/var/www/html/storage/app/private/backups
      - shared_public:/shared_public
    healthcheck:
      test: ["CMD-SHELL", "php artisan tinker --execute=\"DB::connection()->getPdo(); echo 'OK';\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - "no-new-privileges:true"
    read_only: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 200
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.25.4-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - shared_public:/var/www/html/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 100
    depends_on:
      backend:
        condition: service_healthy

  mysql:
    image: mariadb:11.4.3
    restart: unless-stopped
    command:
      - "--max_connections=200"
      - "--innodb_strict_mode=ON"
      - "--skip-name-resolve"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-hospital_billing}
      MARIADB_USER: ${DB_USERNAME:-hospital}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 1024m
    cpus: "1.5"
    pids_limit: 300

  queue-worker:
    image: s_hospital-queue-worker:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    restart: unless-stopped
    command: php artisan queue:work --queue=backups --tries=1 --timeout=600
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_SCHEME: ${APP_SCHEME:-http}
      APP_URL: ${APP_SCHEME:-http}://${SERVER_IP:?SERVER_IP is required}:${APP_PORT:-8000}
      HOSPITAL_ALLOW_INSECURE_HTTP: ${HOSPITAL_ALLOW_INSECURE_HTTP:?Set 0 for HTTPS or 1 to explicitly accept insecure LAN HTTP}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hospital_billing}
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_STORE: database
      DB_CACHE_TABLE: cache
      DB_CACHE_LOCK_TABLE: cache_locks
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      LOG_CHANNEL: daily
      LOG_LEVEL: warning
      HOSPITAL_DUMP_BINARY: /usr/bin/mariadb-dump
      HOSPITAL_BACKUP_ENCRYPTION_KEY: ${HOSPITAL_BACKUP_ENCRYPTION_KEY:?HOSPITAL_BACKUP_ENCRYPTION_KEY is required}
      RUN_MIGRATIONS: "false"
      SERVER_IP: ${SERVER_IP:?SERVER_IP is required}
      SANCTUM_STATEFUL_DOMAINS: ${SERVER_IP},${SERVER_IP}:${APP_PORT:-8000}
      CORS_ALLOWED_ORIGINS: ${APP_SCHEME:-http}://${SERVER_IP}:${APP_PORT:-8000}
      BROADCAST_CONNECTION: pusher
      PUSHER_APP_ID: ${PUSHER_APP_ID:?PUSHER_APP_ID is required}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:?PUSHER_APP_KEY is required}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:?PUSHER_APP_SECRET is required}
      PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
      PUSHER_HOST: soketi
      PUSHER_PORT: 6001
      PUSHER_SCHEME: http
      PUSHER_CLIENT_HOST: ${SERVER_IP:?SERVER_IP is required}
      PUSHER_CLIENT_PORT: ${APP_PORT:-8000}
      PUSHER_CLIENT_SCHEME: ${APP_SCHEME:-http}
    volumes:
      - backup_data:/var/www/html/storage/app/private/backups
    healthcheck:
      test: ["CMD-SHELL", "php artisan tinker --execute=\"DB::connection()->getPdo(); echo 'OK';\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 384m
    cpus: "0.5"
    pids_limit: 150
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started

  # Scheduler sidecar: uses the production Laravel image so `php artisan`
  # is available inside the container. It runs the Laravel scheduler once
  # per minute and writes a local heartbeat for Docker health checks.
  scheduler:
    image: s_hospital-scheduler:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    restart: unless-stopped
    command: >
      sh -c "
        while true; do
          if php artisan schedule:run --no-interaction; then
            php artisan hospital:scheduler-tick --result=ok;
            date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/scheduler.last;
          else
            php artisan hospital:scheduler-tick --result=fail --message='schedule:run failed' || true;
            exit 1;
          fi;
          sleep 60;
        done
      "
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_SCHEME: ${APP_SCHEME:-http}
      APP_URL: ${APP_SCHEME:-http}://${SERVER_IP:?SERVER_IP is required}:${APP_PORT:-8000}
      HOSPITAL_ALLOW_INSECURE_HTTP: ${HOSPITAL_ALLOW_INSECURE_HTTP:?Set 0 for HTTPS or 1 to explicitly accept insecure LAN HTTP}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hospital_billing}
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      HOSPITAL_DAILY_BACKUP_TIME: ${HOSPITAL_DAILY_BACKUP_TIME:-02:00}
      HOSPITAL_OPERATION_START: ${HOSPITAL_OPERATION_START:-06:00}
      HOSPITAL_OPERATION_END: ${HOSPITAL_OPERATION_END:-18:00}
      HOSPITAL_AUDIT_RETENTION_DAYS: ${HOSPITAL_AUDIT_RETENTION_DAYS:-365}
      HOSPITAL_FAILED_JOBS_RETENTION_DAYS: ${HOSPITAL_FAILED_JOBS_RETENTION_DAYS:-30}
      CACHE_STORE: database
      DB_CACHE_TABLE: cache
      DB_CACHE_LOCK_TABLE: cache_locks
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      LOG_CHANNEL: daily
      LOG_LEVEL: warning
      HOSPITAL_DUMP_BINARY: /usr/bin/mariadb-dump
      HOSPITAL_BACKUP_ENCRYPTION_KEY: ${HOSPITAL_BACKUP_ENCRYPTION_KEY:?HOSPITAL_BACKUP_ENCRYPTION_KEY is required}
      RUN_MIGRATIONS: "false"
      SERVER_IP: ${SERVER_IP:?SERVER_IP is required}
      SANCTUM_STATEFUL_DOMAINS: ${SERVER_IP},${SERVER_IP}:${APP_PORT:-8000}
      CORS_ALLOWED_ORIGINS: ${APP_SCHEME:-http}://${SERVER_IP}:${APP_PORT:-8000}
    volumes:
      - backup_data:/var/www/html/storage/app/private/backups
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/scheduler.last && find /tmp/scheduler.last -mmin -3 | grep -q . || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 384m
    cpus: "0.5"
    pids_limit: 150
    depends_on:
      backend:
        condition: service_healthy

  # Soketi: Pusher-compatible WebSocket server. Cashier clients
  # (laravel-echo + pusher-js) subscribe to channels declared in
  # backend/routes/channels.php and receive real-time events emitted
  # from the Actions (InvoiceChanged, PaymentChanged,
  # CashSessionChanged). Eliminates the polling-tax on every cashier
  # PC and keeps every open invoice list, dashboard, and cash session
  # in sync within ~1.5s.
  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    restart: unless-stopped
    command: >
      sh -c "
        soketi start \
          --port=6001
      "
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:?PUSHER_APP_ID is required}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:?PUSHER_APP_KEY is required}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:?PUSHER_APP_SECRET is required}
    expose:
      - "6001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net'); const s=net.createConnection(6001,'127.0.0.1'); s.on('connect',()=>process.exit(0)); s.on('error',()=>process.exit(1)); setTimeout(()=>process.exit(1),2000);\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 96m
    cpus: "0.25"
    pids_limit: 100
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_prod_data:
  backup_data:
  shared_public:
