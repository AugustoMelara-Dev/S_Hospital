services:
  backend:
    image: s_hospital-backend:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    restart: unless-stopped
    command: sh -c "mkdir -p /shared_public && cp -r /var/www/html/public/. /shared_public/ && cp -r /var/www/frontend/dist/. /shared_public/ && exec php-fpm"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: http://${SERVER_IP:?SERVER_IP is required}:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hospital_billing}
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      LOG_CHANNEL: daily
      LOG_LEVEL: warning
      HOSPITAL_DUMP_BINARY: /usr/bin/mariadb-dump
      RUN_MIGRATIONS: "true"
      SERVER_IP: ${SERVER_IP:?SERVER_IP is required}
      SANCTUM_STATEFUL_DOMAINS: ${SERVER_IP},${SERVER_IP}:${APP_PORT:-8000}
      CORS_ALLOWED_ORIGINS: http://${SERVER_IP}:${APP_PORT:-8000}
    volumes:
      - backup_data:/var/www/html/storage/app/private/backups
      - shared_public:/shared_public
    healthcheck:
      test: ["CMD-SHELL", "php artisan tinker --execute=\"DB::connection()->getPdo(); echo 'OK';\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - shared_public:/var/www/html/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  mysql:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-hospital_billing}
      MARIADB_USER: ${DB_USERNAME:-hospital}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  queue-worker:
    image: s_hospital-queue-worker:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    restart: unless-stopped
    command: php artisan queue:work --queue=backups --tries=1 --timeout=600
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hospital_billing}
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      LOG_CHANNEL: daily
      LOG_LEVEL: warning
      HOSPITAL_DUMP_BINARY: /usr/bin/mariadb-dump
      RUN_MIGRATIONS: "false"
      SERVER_IP: ${SERVER_IP:?SERVER_IP is required}
      SANCTUM_STATEFUL_DOMAINS: ${SERVER_IP},${SERVER_IP}:${APP_PORT:-8000}
      CORS_ALLOWED_ORIGINS: http://${SERVER_IP}:${APP_PORT:-8000}
    volumes:
      - backup_data:/var/www/html/storage/app/private/backups
    healthcheck:
      test: ["CMD-SHELL", "php artisan tinker --execute=\"DB::connection()->getPdo(); echo 'OK';\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  mysql_prod_data:
  backup_data:
  shared_public:
