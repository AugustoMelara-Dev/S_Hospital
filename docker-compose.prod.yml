services:
  backend:
    image: s_hospital-backend:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /shared_public &&
        cp -r /var/www/html/public/. /shared_public/ &&
        cp -r /var/www/frontend/dist/. /shared_public/ &&
        test -f /shared_public/index.html || { echo 'FATAL: frontend dist is empty'; exit 1; } &&
        php artisan config:cache &&
        exec php-fpm
      "
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: https://${SERVER_IP:?SERVER_IP is required}:${APP_HTTPS_PORT:-443}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hospital_billing}
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      LOG_CHANNEL: daily
      LOG_LEVEL: warning
      HOSPITAL_DUMP_BINARY: /usr/bin/mariadb-dump
      HOSPITAL_LICENSE_SALT: ${HOSPITAL_LICENSE_SALT:?HOSPITAL_LICENSE_SALT must be set to a 32+ char random string}
      RUN_MIGRATIONS: "true"
      SERVER_IP: ${SERVER_IP:?SERVER_IP is required}
      SANCTUM_STATEFUL_DOMAINS: ${SERVER_IP},${SERVER_IP}:${APP_HTTPS_PORT:-443}
      CORS_ALLOWED_ORIGINS: https://${SERVER_IP},https://${SERVER_IP}:${APP_HTTPS_PORT:-443}
    volumes:
      - backup_data:/var/www/html/storage/app/private/backups
      - shared_public:/shared_public
    healthcheck:
      test: ["CMD-SHELL", "php artisan tinker --execute=\"DB::connection()->getPdo(); echo 'OK';\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - "no-new-privileges:true"
    read_only: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 200
    labels:
      - "org.opencontainers.image.source=https://github.com/hospital-san-isidro/s-hospital"
      - "hospital.org=S_Hospital"
      - "hospital.role=backend"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.25.4-alpine
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/hospital-common.conf:/etc/nginx/snippets/hospital-common.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - shared_public:/var/www/html/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    mem_limit: 192m
    cpus: "0.5"
    pids_limit: 100
    labels:
      - "org.opencontainers.image.source=https://github.com/hospital-san-isidro/s-hospital"
      - "hospital.org=S_Hospital"
      - "hospital.role=nginx"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      backend:
        condition: service_healthy

  mysql:
    image: mariadb:11.4.3
    restart: unless-stopped
    command:
      - "--max_connections=200"
      - "--innodb_strict_mode=ON"
      - "--skip-name-resolve"
      - "--binlog_expire_logs_seconds=604800"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-hospital_billing}
      MARIADB_USER: ${DB_USERNAME:-hospital}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 1024m
    cpus: "1.5"
    pids_limit: 300
    labels:
      - "org.opencontainers.image.source=https://github.com/hospital-san-isidro/s-hospital"
      - "hospital.org=S_Hospital"
      - "hospital.role=mysql"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  queue-worker:
    image: s_hospital-queue-worker:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    restart: unless-stopped
    # --max-jobs and --max-time force a clean restart of the worker
    # every 200 jobs or 1 hour to avoid memory growth in the long
    # running PHP process. Docker's restart policy (unless-stopped)
    # then brings a fresh worker back up automatically.
    command: >
      sh -c "
        while true; do
          php artisan queue:work --queue=backups --tries=1 --timeout=600 --max-jobs=200 --max-time=3600 --sleep=3 --backoff=10;
          echo 'queue-worker: restarting per max-jobs/max-time';
          sleep 2;
        done
      "
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hospital_billing}
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      LOG_CHANNEL: daily
      LOG_LEVEL: warning
      HOSPITAL_DUMP_BINARY: /usr/bin/mariadb-dump
      RUN_MIGRATIONS: "false"
      SERVER_IP: ${SERVER_IP:?SERVER_IP is required}
      SANCTUM_STATEFUL_DOMAINS: ${SERVER_IP},${SERVER_IP}:${APP_HTTPS_PORT:-443}
      CORS_ALLOWED_ORIGINS: https://${SERVER_IP},https://${SERVER_IP}:${APP_HTTPS_PORT:-443}
    volumes:
      - backup_data:/var/www/html/storage/app/private/backups
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          php artisan tinker --execute='DB::connection()->getPdo();
          $$worker = DB::table("jobs")->where("queue", "backups")->count();
          $$failed = DB::table("failed_jobs")->where("queue", "backups")->where("failed_at", ">=", now()->subHour())->count();
          if ($$failed > 5) { exit(1); }
          echo "OK pending=" . $$worker;'
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 384m
    cpus: "0.5"
    pids_limit: 150
    labels:
      - "org.opencontainers.image.source=https://github.com/hospital-san-isidro/s-hospital"
      - "hospital.org=S_Hospital"
      - "hospital.role=queue-worker"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started

  # Scheduler sidecar: runs `php artisan schedule:run` every minute via
  # supercronic. The Laravel scheduler is the canonical way to dispatch
  # the daily/15-minute backup jobs, the audit-log prune, and the
  # failed-jobs prune registered in backend/routes/console.php.
  #
  # Without this sidecar, those jobs simply never run in production.
  # supercronic is a cron replacement that handles signals cleanly inside
  # a container and exits the process on SIGTERM.
  scheduler:
    image: supercronic/supercronic:v1.2.3
    restart: unless-stopped
    command: ["supercronic", "/etc/crontab"]
    volumes:
      - ./nginx/crontab:/etc/crontab:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hospital_billing}
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      HOSPITAL_DAILY_BACKUP_TIME: ${HOSPITAL_DAILY_BACKUP_TIME:-02:00}
      HOSPITAL_OPERATION_START: ${HOSPITAL_OPERATION_START:-06:00}
      HOSPITAL_OPERATION_END: ${HOSPITAL_OPERATION_END:-18:00}
      HOSPITAL_AUDIT_RETENTION_DAYS: ${HOSPITAL_AUDIT_RETENTION_DAYS:-365}
      HOSPITAL_FAILED_JOBS_RETENTION_DAYS: ${HOSPITAL_FAILED_JOBS_RETENTION_DAYS:-30}
      HOSPITAL_LICENSE_SALT: ${HOSPITAL_LICENSE_SALT:?HOSPITAL_LICENSE_SALT must be set to a 32+ char random string}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/supercronic.last && find /tmp/supercronic.last -mmin -3 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 64m
    cpus: "0.25"
    pids_limit: 50
    labels:
      - "org.opencontainers.image.source=https://github.com/hospital-san-isidro/s-hospital"
      - "hospital.org=S_Hospital"
      - "hospital.role=scheduler"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      backend:
        condition: service_healthy

  # Soketi: Pusher-compatible WebSocket server. Cashier clients
  # (laravel-echo + pusher-js) subscribe to channels declared in
  # backend/routes/channels.php and receive real-time events emitted
  # from the Actions (InvoiceChanged, PaymentChanged,
  # CashSessionChanged). Eliminates the polling-tax on every cashier
  # PC and keeps every open invoice list, dashboard, and cash session
  # in sync within ~1.5s.
  #
  # In v1.0.0 PRODUCTION_READY the WebSocket is NOT exposed on the host.
  # Cashier PCs reach it through nginx at https://$SERVER_IP/ws which
  # proxies the Upgrade request to soketi:6001. This keeps Soketi
  # inside the docker network (no second port to open in the firewall)
  # and lets the same TLS cert cover the SPA and the WebSocket.
  soketi:
    image: soketi/soketi:1.6-16-alpine
    restart: unless-stopped
    # --max-connections caps simultaneous WebSocket clients. Sized for
    # 5 cashier PCs each running 2-3 tabs plus headroom for re-connect
    # storms; raising it requires a Soketi license key.
    # --websocket-max-message-size / --websocket-max-message-size-kb
    # reject oversized client messages to prevent a runaway cashier
    # tab from saturating the server with a 10MB event.
    command: >
      sh -c "
        soketi start \
          --host=0.0.0.0 \
          --port=6001 \
          --default-app-id=$${PUSHER_APP_ID:-hospital-app} \
          --default-app-key=$${PUSHER_APP_KEY:-hospital-key} \
          --default-app-secret=$${PUSHER_APP_SECRET:-hospital-secret} \
          --max-connections=100 \
          --websocket-max-message-size=10240 \
          --metrics.enabled=true \
          --metrics.port=9601
      "
    environment:
      PUSHER_APP_ID: ${PUSHER_APP_ID:-hospital-app}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:-hospital-key}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:-hospital-secret}
    # Soketi listens on the internal docker network only. No `ports:`
    # mapping here: cashier PCs reach it through nginx at /ws.
    expose:
      - "6001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6001/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 100
    labels:
      - "org.opencontainers.image.source=https://github.com/hospital-san-isidro/s-hospital"
      - "hospital.org=S_Hospital"
      - "hospital.role=soketi"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_prod_data:
  backup_data:
  shared_public:
