# =============================================================================
# S_Hospital TLS server block (optional, opt-in).
#
# This file is ONLY mounted by the TLS overlay:
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
#
# The plain HTTP server in nginx/default.conf stays published as a liveness,
# static-asset and certificate-bootstrap path: there is no forced redirect and
# no HSTS on port 80. While this TLS server block is active and the overlay
# sets SESSION_SECURE_COOKIE=true, the HTTP port cannot hold an authenticated
# session (Secure cookies are never sent over http://); authenticated flows
# must use the https:// origin. Rollback to HTTP auth is restarting without
# the overlay. Certificates live in nginx/ssl (git-ignored) and are generated
# with:
#   powershell -File scripts/generate_local_ca.ps1 -ServerIp <LAN-IP>
#
# HSTS is intentionally NOT duplicated here: Laravel AddSecurityHeaders emits
# Strict-Transport-Security only on secure production requests. If the hospital
# later wants nginx-owned HSTS, add it inside THIS server block only, after
# every client trusts the CA.
#
# Keep the location blocks in sync with nginx/default.conf.
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/hospital-server.crt.pem;
    ssl_certificate_key /etc/nginx/ssl/hospital-server.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 32M;

    # Docker DNS is dynamic: resolving backend/soketi only once at Nginx
    # startup can leave proxies pointing at stale container IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm_upstream backend:9000;
    set $soketi_upstream soketi:6001;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        font/woff2
        image/svg+xml;

    # Health check: plain text without touching Laravel.
    location = /up {
        add_header Content-Type text/plain always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        return 200 "ok\n";
    }

    # Pusher/Soketi WebSocket over TLS. laravel-echo + pusher-js connect to
    # wss://<server>/app/<key>, so the LAN never needs the 6001 host port.
    location /app {
        proxy_pass http://$soketi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # API routes go to Laravel before the SPA fallback.
    location /api/ {
        try_files $uri /index.php?$query_string;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $query_string;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 600s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        access_log off;
    }

    # Sanctum CSRF cookie.
    location = /sanctum/csrf-cookie {
        try_files $uri /index.php?$query_string;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
    }

    # Deny dotfiles except well-known.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Hashed assets. connect-src allows the same-origin WSS endpoint only.
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'" always;
        access_log off;
    }

    location = /index.php {
        try_files $uri =404;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 600s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # SPA fallback through Laravel for the CSP nonce replacement.
    location / {
        try_files /index.php =404;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 600s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }
}
