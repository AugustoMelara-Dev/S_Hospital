# =============================================================================
# Nginx production config for S_Hospital.
#
# HTTP on port 80 always serves the app. When the optional SSL block is
# uncommented, requests to https://<server>/ are also served. Generate the
# cert materials with scripts/generate_local_ca.ps1.
#
# IMPORTANT: keep in sync with the .env SERVER_IP / APP_PORT.
# =============================================================================

# ---- HTTP (always on) ----
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.html;

    client_max_body_size 32M;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        font/woff2
        image/svg+xml;

    # Health check: servir texto plano sin pasar por Laravel.
    location = /up { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Cabeceras comunes de seguridad eliminadas del nivel de servidor (ver location / y Laravel)
    # Rutas API: enrutar a Laravel (PHP-FPM) antes que el fallback SPA.
    # IMPORTANTE: el orden es clave. /api/ debe ir ANTES de / para que
    # nginx no sirva el index.html de la SPA en lugar del backend.
    location /api/ {
        try_files $uri /index.php?$query_string;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $query_string;
        fastcgi_read_timeout 600s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        access_log off;
    }

    # Sanctum CSRF cookie: tambien va al backend.
    location = /sanctum/csrf-cookie {
        try_files $uri /index.php?$query_string;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # Denegar acceso a archivos/dotfiles sensibles.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Cache agresivo para assets con hash (vite genera nombres tipo index-XXX.js).
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://$host:6001 wss://$host:6001; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'" always;
        access_log off;
    }

    # PHP-FPM directo (por si se accede a /index.php).
    location = /index.php {
        try_files $uri =404;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 600s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # SPA fallback: cualquier otra ruta devuelve el index.html para que
    # React Router tome el control. Va DESPUES de /api/ y /sanctum/.
    location / {
        # Cabeceras de seguridad para index.html
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://$host:6001 wss://$host:6001; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'" always;

        try_files $uri $uri/ /index.html;
    }
}

