# =============================================================================
# Nginx production config for S_Hospital.
#
# HTTPS is mandatory in v1.0.0 PRODUCTION_READY. HTTP requests on port 80 are
# permanently redirected to HTTPS on port 443. The TLS material is generated
# during install by scripts/generate_local_ca.ps1 and lives in nginx/ssl/ on
# the host (mounted read-only into the container at /etc/nginx/ssl/).
#
# To regenerate certs (annual rotation, IP change, key compromise):
#   powershell -NoProfile -ExecutionPolicy Bypass `
#     -File scripts\generate_local_ca.ps1 -ServerIp 192.168.1.10
#   docker compose -f docker-compose.prod.yml restart nginx
#
# IMPORTANT: keep SANCTUM_STATEFUL_DOMAINS and CORS_ALLOWED_ORIGINS in
# backend/.env in sync with the https://$SERVER_IP used here.
# =============================================================================

# Map the requested host header to a single internal server name so the
# Server: header does not leak the docker-compose service name.
map $host $hospital_server_name {
    default $host;
    ~^_$ hospital.local;
}

# ---- HTTP -> HTTPS redirect (always on) ----
server {
    listen 80 default_server;
    server_name _;

    # /.well-known/acme-challenge/* can be served over HTTP for cert
    # renewal if the operator ever switches to ACME. Today we only
    # support local CA so just return 404 for unknown paths.
    location /.well-known/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS (mandatory in PRODUCTION_READY) ----
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/hospital-server.crt.pem;
    ssl_certificate_key /etc/nginx/ssl/hospital-server.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: trust the local CA by installing it on every cashier PC.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Shared app, PHP-FPM, headers and static asset rules.
    include /etc/nginx/snippets/hospital-common.conf;

    # ---- Soketi WebSocket (cross-PC realtime) ----
    # Browsers on cashier PCs reach the WebSocket through nginx instead of
    # connecting directly to the Soketi container (which is not exposed on
    # the host). Same-origin over port 443 keeps the Soketi WS behind the
    # same TLS cert that serves the SPA, so the browser does not need to
    # trust a second origin.
    location /ws/ {
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass http://soketi:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
