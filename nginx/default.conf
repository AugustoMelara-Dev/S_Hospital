# =============================================================================
# Nginx production config for S_Hospital.
#
# HTTP on port 80 always serves the app. When the optional SSL block is
# uncommented, requests to https://<server>/ are also served. Generate the
# cert materials with scripts/generate_local_ca.ps1.
#
# IMPORTANT: keep in sync with the .env SERVER_IP / APP_PORT.
# =============================================================================

# ---- HTTP (always on) ----
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.html;

    client_max_body_size 32M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Enforced CSP is set by Laravel middleware (AddSecurityHeaders) with a
    # per-request nonce. The browser-side CSP report endpoint is
    # /api/system/csp-report.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'nonce-{NONCE}'; style-src 'self' 'nonce-{NONCE}'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; report-uri /api/system/csp-report" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        font/woff2
        image/svg+xml;

    location = /up { return 200 "ok\n"; add_header Content-Type text/plain; }

    # SPA fallback for unknown paths (return index.html for client routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files and the .git directory.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Static asset cache.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # PHP-FPM proxy.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 600s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }
}

