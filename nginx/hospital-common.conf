# =============================================================================
# Shared S_Hospital location blocks, headers, and caching rules.
# Included by both the HTTP (port 80 redirect) and HTTPS (port 443) server
# blocks in default.conf. Editing here propagates to every HTTPS listener.
# =============================================================================

root /var/www/html/public;
index index.html;

client_max_body_size 32M;
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;

server_tokens off;

# Enforced CSP is set by the Laravel middleware (AddSecurityHeaders) with a
# per-request nonce. The browser-side CSP report endpoint is
# /api/system/csp-report. Nginx adds the report-only fallback so any
# browser that did not receive the dynamic header still gets a sane
# policy.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none'; report-uri /api/system/csp-report" always;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/wasm
    font/woff2
    image/svg+xml;

# Health endpoint for the in-container probe and external monitors.
location = /up { return 200 "ok\n"; add_header Content-Type text/plain; }

# SPA fallback for unknown paths (return index.html for client routing).
location / {
    try_files $uri $uri/ /index.html;
}

# Deny access to hidden files and the .git directory.
location ~ /\.(?!well-known).* {
    deny all;
    return 404;
}

# Static asset cache. Hashed assets are immutable, plain assets are
# short-cached to keep cashier PC browsers warm.
location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
}

# PHP-FPM proxy. The backend service is reachable on its docker-compose
# internal DNS name; we never expose 9000 to the host.
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass backend:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_read_timeout 600s;
    fastcgi_buffers 16 32k;
    fastcgi_buffer_size 64k;
    # Surface real client IP to Laravel for audit logs and rate limiting.
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
}
