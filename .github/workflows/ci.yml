name: CI

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main, codex/**]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply-chain preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Test supply-chain guard
        shell: pwsh
        run: ./scripts/security/test-supply-chain-check.ps1

      - name: Scan dependency locks before install
        shell: pwsh
        run: ./scripts/security/supply-chain-check.ps1 -ProjectRoot . -SkipTemp

  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    needs: supply-chain
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, pdo_mysql, pdo_sqlite, zip, gd, bcmath, opcache
          coverage: pcov
          ini-values: memory_limit=512M

      - name: Cache Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer audit
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Laravel key + cache
        working-directory: backend
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          php artisan config:clear

      - name: Run PHPUnit
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          vendor/bin/phpunit --testdox

      - name: Assert backend tests leave worktree clean
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Backend tests left tracked changes or untracked files:"
            git status --short --untracked-files=all
            exit 1
          fi

      - name: Run Pint code style
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Run PHPStan static analysis
        working-directory: backend
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --no-progress
          else
            echo "phpstan not installed; skipping"
          fi

  backend-mariadb:
    name: Backend (MariaDB)
    runs-on: ubuntu-latest
    needs: supply-chain
    timeout-minutes: 30
    env:
      CI_MARIADB_ROOT_PASSWORD: ${{ secrets.CI_MARIADB_ROOT_PASSWORD || vars.CI_MARIADB_ROOT_PASSWORD || format('ci-root-db-{0}', github.run_id) }}
      CI_MARIADB_PASSWORD: ${{ secrets.CI_MARIADB_PASSWORD || vars.CI_MARIADB_PASSWORD || format('ci-db-{0}', github.run_id) }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.CI_MARIADB_ROOT_PASSWORD || vars.CI_MARIADB_ROOT_PASSWORD || format('ci-root-db-{0}', github.run_id) }}
          MARIADB_DATABASE: hospital_billing
          MARIADB_USER: hospital
          MARIADB_PASSWORD: ${{ secrets.CI_MARIADB_PASSWORD || vars.CI_MARIADB_PASSWORD || format('ci-db-{0}', github.run_id) }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, pdo_mysql, zip, gd, bcmath, opcache
          ini-values: memory_limit=512M

      - name: Cache Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/vendor
          key: composer-mariadb-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}

      - name: Composer audit
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u hospital -p"${CI_MARIADB_PASSWORD}" --silent 2>/dev/null; then
              echo "MariaDB ready"
              exit 0
            fi
            echo "Waiting for MariaDB..."
            sleep 2
          done
          exit 1

      - name: Configure env
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force
          sed -i 's|DB_CONNECTION=.*|DB_CONNECTION=mysql|' .env
          sed -i 's|DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|DB_PORT=.*|DB_PORT=3306|' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=hospital_billing|' .env
          sed -i 's|DB_USERNAME=.*|DB_USERNAME=hospital|' .env
          sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${CI_MARIADB_PASSWORD}|" .env

      - name: Run migrations + seed
        working-directory: backend
        run: |
          php artisan config:clear
          php artisan migrate --force
          php artisan db:seed --class=RolesAndPermissionsSeeder --force
          php artisan db:seed --class=ServiceCatalogSeeder --force || true

      - name: Run PHPUnit (MariaDB)
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hospital_billing
          DB_USERNAME: hospital
          DB_PASSWORD: ${{ env.CI_MARIADB_PASSWORD }}
        run: vendor/bin/phpunit --testdox

  frontend:
    name: Frontend (Vitest + lint + build)
    runs-on: ubuntu-latest
    needs: supply-chain
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Scan installed supply-chain indicators
        shell: pwsh
        run: ./scripts/security/supply-chain-check.ps1 -ProjectRoot . -SkipTemp

      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high

      - name: TypeScript typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: ESLint
        working-directory: frontend
        run: pnpm run lint

      - name: Vitest
        working-directory: frontend
        run: pnpm run test

      - name: Build
        working-directory: frontend
        run: pnpm run build

      - name: Enforce bundle budget
        working-directory: frontend
        run: pnpm run budget:bundle

  e2e-mocked:
    name: E2E (mocked Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, pdo_sqlite, zip, gd, bcmath
          ini-values: memory_limit=512M

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run mocked E2E
        working-directory: frontend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          # The production-readiness spec is fully mocked at the route level
          # and does not require a live backend; we just need the SPA built
          # and Playwright's route handlers in place.
          pnpm run test:e2e -- --reporter=list
