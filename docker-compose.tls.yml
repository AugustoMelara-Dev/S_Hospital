# =============================================================================
# S_Hospital TLS overlay (opt-in). The default docker-compose.prod.yml stays
# HTTP-only and untouched: 443 is published and the certificates are mounted
# only when this overlay is selected explicitly.
#
# Usage:
#   1. powershell -File scripts\generate_local_ca.ps1 -ServerIp <LAN-IP>
#   2. Install nginx\ssl\hospital-ca.crt.pem as Trusted Root on every client PC.
#   3. Set HOSPITAL_TLS_ORIGIN in .env to the exact browser origin
#      (e.g. https://192.168.1.10 or the DNS name passed to
#      generate_local_ca.ps1 -ServerNames, like https://hospital.local)
#   4. docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
#
# HTTP on APP_PORT stays published, but it is NOT an authenticated session
# path while this overlay is active: SESSION_SECURE_COOKIE=true makes the
# session and XSRF cookies Secure-only, so browsers will not store them from a
# plain http:// response; login/CSRF cannot complete (419/401) and only public
# endpoints (up, /api/system/health, branding) stay usable. Use
# https://HOSPITAL_TLS_ORIGIN for every authenticated flow. There is no forced
# redirect and no HSTS on port 80.
#
# Rollback to HTTP is done by restarting WITHOUT this overlay (the base file
# restores SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-false}):
#   docker compose -f docker-compose.prod.yml up -d
#
# Rollback caveat (HSTS): while this overlay serves HTTPS in production,
# Laravel answers secure responses with
# `Strict-Transport-Security: max-age=31536000; includeSubDomains`
# (backend/app/Http/Middleware/AddSecurityHeaders.php). A browser that already
# received that header stores an HTTPS-only policy for the host for up to a
# year and may keep upgrading/refusing plain http://HOSPITAL_TLS_ORIGIN after
# the rollback until max-age expires or HSTS is cleared in that browser.
# nginx does not add HSTS itself; this comment changes no behavior.
# =============================================================================
services:
  nginx:
    # List merge: keeps the default ${APP_BIND_IP}:${APP_PORT}:80 mapping and
    # adds TLS. Certificates are required by nginx/tls.conf.
    ports:
      - "${TLS_BIND_IP:-0.0.0.0}:${TLS_PORT:-443}:443"
    volumes:
      - ./nginx/tls.conf:/etc/nginx/conf.d/tls.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

  backend:
    # URL/CORS/session/realtime coherence for the HTTPS origin. The HTTP
    # mapping still exists on APP_PORT, but application links and cookies
    # follow the TLS origin while this overlay is active.
    environment:
      APP_SCHEME: https
      APP_URL: ${HOSPITAL_TLS_ORIGIN:?HOSPITAL_TLS_ORIGIN is required for TLS mode}
      CORS_ALLOWED_ORIGINS: ${HOSPITAL_TLS_ORIGIN:?HOSPITAL_TLS_ORIGIN is required for TLS mode}
      # SERVER_IP forms are explicit; the TLS origin hostname (e.g. a DNS name
      # passed to `generate_local_ca.ps1 -ServerNames`) is derived from
      # APP_URL/CORS_ALLOWED_ORIGINS by backend/config/sanctum.php, so the
      # stateful list always matches the origin the browser actually uses.
      SANCTUM_STATEFUL_DOMAINS: ${SERVER_IP},${SERVER_IP}:${APP_PORT:-8000},${SERVER_IP}:${TLS_PORT:-443}
      SESSION_SECURE_COOKIE: "true"
      PUSHER_CLIENT_SCHEME: wss
      PUSHER_CLIENT_PORT: ${TLS_PORT:-443}
