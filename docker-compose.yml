services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.docker.example
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hospital_billing}
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:-hospital_dev}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - ./frontend/dist:/var/www/frontend/dist
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "composer install &&
             if [ ! -f .env ]; then cp .env.docker.example .env && php artisan key:generate --force; fi &&
             php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:${APP_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  mysql:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-hospital_billing}
      MARIADB_USER: ${DB_USERNAME:-hospital}
      MARIADB_PASSWORD: ${DB_PASSWORD:-hospital_dev}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  backend_vendor:
  frontend_node_modules:
  mysql_data:
