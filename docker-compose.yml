services:
  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: Sistema de Caja Hospitalaria
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hospital_billing}
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      HOSPITAL_BACKUP_ENCRYPTION_KEY: ${HOSPITAL_BACKUP_ENCRYPTION_KEY:?HOSPITAL_BACKUP_ENCRYPTION_KEY is required}
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - ./.env.example:/var/www/.env.example:ro
      - ./.github:/var/www/.github:ro
      - ./.gitignore:/var/www/.gitignore:ro
      - ./docker-compose.yml:/var/www/docker-compose.yml:ro
      - ./docker-compose.prod.yml:/var/www/docker-compose.prod.yml:ro
      - ./docs:/var/www/docs:ro
      - ./frontend/e2e:/var/www/frontend/e2e:ro
      - ./frontend/dist:/var/www/frontend/dist
      - ./nginx:/var/www/nginx:ro
      - ./setup.bat:/var/www/setup.bat:ro
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "composer install &&
             if [ ! -f .env ]; then cp .env.docker.example .env && php artisan key:generate --force; fi &&
             cd public &&
             exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"

  frontend:
    build:
      context: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./qa:/qa
    environment:
      VITE_DEV_API_PROXY_TARGET: http://backend:8000
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  mysql:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-hospital_billing}
      MARIADB_USER: ${DB_USERNAME:-hospital}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  backend_vendor:
  frontend_node_modules:
  mysql_data:
