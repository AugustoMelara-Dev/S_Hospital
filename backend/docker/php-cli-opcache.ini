; The local Docker web server runs through the CLI SAPI. Without this flag,
; every request recompiles Laravel from the Windows bind mount.
opcache.enable_cli=1
; The application source is bind-mounted from Windows. Revalidating every
; request makes Laravel stat hundreds of host files and causes 10–25s stalls.
; Restart the backend container after changing PHP source.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.file_cache=/tmp/s-hospital-opcache
opcache.file_cache_consistency_checks=0

realpath_cache_size=16M
realpath_cache_ttl=600
