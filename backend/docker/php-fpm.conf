; Sistema de Caja Hospitalaria - PHP-FPM pool tuning.
;
; The default php:8.3-fpm image ships with `pm = dynamic` and
; `pm.max_children = 5`, which starves a 5-cashier LAN under load.
; Replaced with a static pool sized to the docker-compose mem_limit
; of 512m and a safe per-worker memory budget.
;
;   512 MB total - 96 MB for nginx + MariaDB client buffers
;   416 MB available for PHP-FPM
;   ~40 MB per worker (after a typical Laravel request)
;   => 8 workers
;
; min_spare / max_spare keep CPU steady-state low for a small LAN
; while letting the pool burst under morning shift concurrency.

[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000

pm = static
pm.max_children = 8
pm.max_requests = 500
pm.process_idle_timeout = 60s
pm.status_listen = 127.0.0.1:9001

; Opcache is configured in /usr/local/etc/php/conf.d/opcache-recommended.ini.

; Slow log: any request taking more than 5s is suspicious.
; `/tmp` is writable in the production container.
slowlog = /tmp/php-fpm-slow.log
request_slowlog_timeout = 5s

; Stream access log to stdout so `docker compose logs backend` shows
; it without a sidecar.
access.log = /proc/self/fd/2
