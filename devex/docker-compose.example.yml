services:
  app:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
  mysql:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: hospital_billing
      MYSQL_USER: hospital
      MYSQL_PASSWORD: hospital_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
