services:
  app:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
  mysql:
    image: mariadb:11
    environment:
      # Placeholders only. Generate fresh random values for each developer
      # environment (see docs/SECRETS.md) and write them to a gitignored
      # .env file consumed via env_file / docker compose --env-file.
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hospital_billing}
      MYSQL_USER: ${MYSQL_USER:-hospital}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
